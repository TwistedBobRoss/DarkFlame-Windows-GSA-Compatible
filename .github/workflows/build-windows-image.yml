name: Build Windows Image

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - Dockerfile
      - Start-Darkflame.ps1
      - Create-Admin.ps1
      - .github/workflows/build-windows-image.yml

permissions:
  contents: read
  packages: write

jobs:
  build-server-2022:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure Docker is running
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $dockerService = Get-Service -Name docker -ErrorAction SilentlyContinue
          if (-not $dockerService) {
            throw 'Docker service was not found on this Windows runner.'
          }

          if ($dockerService.Status -ne 'Running') {
            Start-Service -Name docker
          }

          $deadline = (Get-Date).AddMinutes(3)
          do {
            docker version
            if ($LASTEXITCODE -eq 0) {
              docker info
              exit 0
            }

            Start-Sleep -Seconds 5
          } while ((Get-Date) -lt $deadline)

          throw 'Docker daemon did not become ready on this Windows runner.'

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: docker build --build-arg WINDOWS_TAG=ltsc2022 -t ghcr.io/twistedbobross/darkflame-windows-gsa-compatible:server-2022 .

      - name: Push
        run: docker push ghcr.io/twistedbobross/darkflame-windows-gsa-compatible:server-2022
